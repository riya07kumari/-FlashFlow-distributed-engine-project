server:
  port: 8080

spring:
  application:
    name: flashflow-backend-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    url: jdbc:h2:mem:flashflowdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

flashflow:
  redis:
    enabled: false
  kafka:
    enabled: false
  reconciliation:
    interval-ms: 30000
    timeout-minutes: 2

logging:
  level:
    com.flashflow: INFO
    org.springframework: WARN
    org.apache.kafka: OFF
