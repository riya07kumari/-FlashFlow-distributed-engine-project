name: FlashFlow CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build, Unit & Concurrency Stress Verification
  # -------------------------------------------------------------
  backend-test:
    name: Backend Build, Concurrency & Failure-Recovery Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Backend Tests (Concurrency, Webhooks, Reconciliation)
        working-directory: flashflow/backend
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          FLASHFLOW_REDIS_ENABLED: "true"
          FLASHFLOW_KAFKA_ENABLED: "false"
        run: |
          chmod +x ./mvnw
          ./mvnw clean test -B

      - name: Package Backend Jar
        working-directory: flashflow/backend
        run: |
          ./mvnw package -DskipTests -B

  # -------------------------------------------------------------
  # Job 2: Frontend Build & Verification
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend React 18 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: flashflow/frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: flashflow/frontend
        run: |
          npm ci || npm install

      - name: Build Frontend Production Bundle
        working-directory: flashflow/frontend
        run: |
          npm run build

  # -------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # -------------------------------------------------------------
  docker-build:
    name: Docker Containerization Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./flashflow/backend
          file: ./flashflow/backend/Dockerfile
          push: false
          tags: flashflow-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./flashflow/frontend
          file: ./flashflow/frontend/Dockerfile
          push: false
          tags: flashflow-frontend:test
