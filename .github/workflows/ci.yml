
name: FlashFlow CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Build, Concurrency & Failure-Recovery Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Java Environment
        shell: bash
        run: |
          set -eu
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          test -f "$JAVA_HOME/lib/security/cacerts"
          keytool -list -cacerts -storepass changeit > /dev/null
          echo "Java default trust store check passed"

      - name: Run Backend Tests and Package
        working-directory: backend
        shell: bash
        env:
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "6379"
          FLASHFLOW_REDIS_ENABLED: "true"
          FLASHFLOW_KAFKA_ENABLED: "false"
        run: |
          set -eu
          chmod +x ./mvnw

          # Remove potentially conflicting Java and Maven options.
          unset JAVA_TOOL_OPTIONS || true
          unset JDK_JAVA_OPTIONS || true
          unset _JAVA_OPTIONS || true
          unset MAVEN_OPTS || true

          echo "Checking Maven and Java versions..."
          ./mvnw -version

          echo "Running backend verification..."
          ./mvnw -U clean verify -B

  frontend-build:
    name: Frontend React 18 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Containerization Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: flashflow-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: flashflow-frontend:test

